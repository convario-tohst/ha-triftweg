# Loads default set of integrations. Do not remove.
default_config:

# Pakete: je Thema eine Datei in /config/packages (z. B. muell.yaml)
homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
knx: !include knx.yaml


template:
  - binary_sensor:
      - name: "Anwesenheit"
        state: "{{ states.person | selectattr('state', 'eq', 'home') | list | count > 0 }}"
        device_class: occupancy

# Müllkalender: Sensoren und Erinnerungen siehe packages/muell.yaml
waste_collection_schedule:
  sources:
    - name: awb_oldenburg_de
      args:
        street: "Triftweg"
        house_number: "106"
      calendar_title: "Abfallkalender"
