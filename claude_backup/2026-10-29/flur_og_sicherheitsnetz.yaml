# Flur OG: Sicherheitsnetz (26.10.) – der Melder 1.1.24 schaltet das Licht selbst, erkennt aber zeitweise
# Dauerbewegung (Präsenz hing seit 24.10., Licht blieb 1,5 h an). HA schaltet nach max. X Minuten am Stück aus;
# bewegt sich danach wirklich jemand, schaltet der Melder wieder ein.
# Später geplant: Melder auf "nur melden" umbauen, HA schaltet (wie HWR/Ankleide Tobias).

input_boolean:
  flur_og_sicherheitsnetz:
    name: "Flur OG: Licht spätestens nach Zeit aus"
    icon: mdi:timer-off-outline

input_number:
  flur_og_max_minuten:
    name: "Flur OG: Licht max. an (Minuten)"
    icon: mdi:timer-sand
    min: 5
    max: 120
    step: 5
    unit_of_measurement: min
    mode: box

automation:
  - id: flur_og_licht_max_dauer
    alias: "Flur OG: Licht nach max. Dauer aus (Sicherheitsnetz)"
    mode: restart
    triggers:
      - trigger: state
        entity_id: light.dimmer_flur_og
        to: "on"
        for:
          minutes: "{{ states('input_number.flur_og_max_minuten') | int(20) }}"
    conditions:
      - condition: state
        entity_id: input_boolean.flur_og_sicherheitsnetz
        state: "on"
    actions:
      - action: light.turn_off
        target: { entity_id: light.dimmer_flur_og }
      - action: logbook.log
        data:
          name: "Flur OG"
          message: "Licht nach {{ states('input_number.flur_og_max_minuten') | int(20) }} min am Stück ausgeschaltet (Sicherheitsnetz)"
