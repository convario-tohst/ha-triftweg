    address: 10/0/0
    scene_number: 1
  - name: "Kochen"
    address: 10/0/0
    scene_number: 2
  - name: "Party"
    address: 10/0/0
    scene_number: 3
  - name: "Aus"
    address: 10/0/0
    scene_number: 4
  - name: "Dinner"
    address: 10/0/0
    scene_number: 7
  - name: "Malte Stripe Szene"
    address: 5/6/0
    scene_number: 1

climate:
  - name: "Heizung Wohnzimmer"
    temperature_address: "3/0/0" # IST-Wert
    target_temperature_state_address: "3/3/20" # Aktueller SOLL-Wert
    setpoint_shift_address: "3/3/24" # Sollwertverschiebung
    setpoint_shift_state_address: "3/3/24" # Sollwertverschiebung (lesend)
    setpoint_shift_mode: "DPT9002" # 2-Byte
    #setpoint_shift_step: 0.5
    temperature_step: 0.5
    #operation_mode_address: "5/1/5"
    #operation_mode_state_address: "5/1/6"
  - name: "Heizung Obergeschoss"
    temperature_address: "3/0/21" # IST-Wert Flur OG Wand (1-Wire)
    target_temperature_state_address: "3/3/3" # Aktueller SOLL-Wert (lesend)
    setpoint_shift_address: "3/3/25" # Sollwertverschiebung
    setpoint_shift_state_address: "3/3/25" # Sollwertverschiebung (lesend)
    setpoint_shift_mode: "DPT9002" # 2-Byte
    setpoint_shift_max: 5
    setpoint_shift_min: -5
    #setpoint_shift_step: 0.5
    temperature_step: 0.5
    #operation_mode_address: "5/1/5"
    #operation_mode_state_address: "5/1/6"
    #active_state_address: "10/5/3" # Ventil Zustand (lesend)
    #operation_mode_address: "10/5/6" # Betriebsmodus
    #operation_mode_state_address: "10/5/7" # Betriebsmodus status
    #command_value_state_address: "10/5/2" # Status Stellwert
  - name: "Heizung Bad Yvonne"
    temperature_address: "3/0/6" # IST-Wert
    target_temperature_state_address: "3/3/4" # Aktueller SOLL-Wert (lesend)
    setpoint_shift_address: "3/3/27" # Sollwertverschiebung
    setpoint_shift_state_address: "3/3/27" # Sollwertverschiebung (lesend)
    setpoint_shift_mode: "DPT9002" # 2-Byte
    setpoint_shift_max: 5
    setpoint_shift_min: -5
    temperature_step: 0.5

    # Raumklima
weather:
  - name: "Wohnzimmer"
    address_temperature: "3/0/26"
    address_humidity: "4/0/0"
    sync_state: true

# Rolladen
cover:
  - name: "Wohnzimmer Rolladen"
    move_long_address: "2/0/8"
    move_short_address: "2/0/11"
    stop_address: "2/0/11"
    #position_address: "3/0/3"
    position_state_address: "2/2/4"
    travelling_time_down: 51
    travelling_time_up: 61
  - name: "Küche Rolladen"
    move_long_address: "2/0/9"
    move_short_address: "2/0/12"
    stop_address: "2/0/12"
    #position_address: "3/0/3"
    position_state_address: "2/2/5"
    travelling_time_down: 51
    travelling_time_up: 61
  - name: "Bad Yvonne Rolladen"
    move_long_address: "2/0/10"
    move_short_address: "2/0/13"
    stop_address: "2/0/13"
    #position_address: "3/0/3"
    position_state_address: "2/2/6"
    travelling_time_down: 51
    travelling_time_up: 61

#Präsenzmelder
binary_sensor:
  - name: "Bewegungsmelder Flur"
    state_address: "1/1/10" # KNX Gruppenadresse für den Status (Bewegung erkannt/nicht erkannt)
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder Sauna"
    state_address: "0/2/29" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Nachtlicht"
    state_address: "0/0/3" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder Außensauna"
    state_address: "0/2/27" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder EG Flur Decke"
    state_address: "0/2/9" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder OG Lara Decke"
    state_address: "0/7/1" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder OG Malte Decke"
    state_address: "0/7/0" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder OG Schlafzimmer Decke"
    state_address: "0/7/2" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenz Gästebad"
    state_address: "0/7/3" # 1.1.25 HLK-Ausgang
    device_class: occupancy
    sync_state: true

sensor:
  - name: "Helligkeit Außen"
    state_address: "0/6/0" # Präsenzmelder Sauna außen 1.1.38
    type: illuminance
    sync_state: true
  - name: "Helligkeit Gästebad"
    state_address: "0/6/1" # 1.1.25 Messwert
    type: illuminance
    sync_state: true

  # Raumtemperaturen (1-Wire über Timberwolf) und aktuelle Sollwerte der Heizungsaktoren
  - { name: "Temperatur Wohnzimmer", state_address: "3/0/0", type: temperature, sync_state: true }
  - { name: "Sollwert Wohnzimmer", state_address: "3/3/20", type: temperature, sync_state: true }
  - { name: "Temperatur Küche", state_address: "3/0/13", type: temperature, sync_state: true }
  - { name: "Temperatur Flur EG", state_address: "3/0/2", type: temperature, sync_state: true }
  - { name: "Sollwert Flur EG", state_address: "3/3/0", type: temperature, sync_state: true }
  - { name: "Temperatur Bad Yvonne", state_address: "3/0/6", type: temperature, sync_state: true }
  - { name: "Sollwert Bad Yvonne", state_address: "3/3/4", type: temperature, sync_state: true }
  - { name: "Temperatur Gästebad", state_address: "3/0/8", type: temperature, sync_state: true }
  - { name: "Temperatur Ankleide", state_address: "3/0/9", type: temperature, sync_state: true }
  - { name: "Sollwert Ankleide", state_address: "3/3/1", type: temperature, sync_state: true }
  - { name: "Temperatur HWR", state_address: "3/0/12", type: temperature, sync_state: true }
  - { name: "Sollwert HWR", state_address: "3/3/5", type: temperature, sync_state: true }
