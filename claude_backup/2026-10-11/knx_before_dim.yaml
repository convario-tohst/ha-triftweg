# KNX
#knx:
# switch
switch:
  - name: "Tag-Nacht EG"
    address: "0/3/0"
  - name: "Tag-Nacht OG"
    address: "0/3/1"
  - name: "Saunaofen"
    address: "1/0/2"
    state_address: "1/1/3"

# Sperre / Zwangsführung der Präsenzmelder (DPT 2.001, 2 Bit): 0 = Automatik, 2 = Aus erzwingen, 3 = An erzwingen
select:
  - name: "Melder Wohnzimmer"
    address: "0/5/5" # 1.1.23 Lichtkanal 1+2 Zwangsführung
    payload_length: 0
    options: &zwang
      - { option: "Automatik", payload: 0 }
      - { option: "Aus erzwingen", payload: 2 }
      - { option: "An erzwingen", payload: 3 }
  - name: "Melder Flur EG"
    address: "0/5/1" # 1.1.22 Sperre
    payload_length: 0
    options: *zwang
  - name: "Melder Sauna außen"
    address: "0/5/2" # 1.1.38 Zwangsführung
    payload_length: 0
    options: *zwang
  - name: "Melder Bad OG"
    address: "0/4/2" # 1.1.18 Zwangsführung
    payload_length: 0
    options: *zwang

