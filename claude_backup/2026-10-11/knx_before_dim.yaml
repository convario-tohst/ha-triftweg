    sync_state: true

# Rolladen
cover:
  - name: "Wohnzimmer Rolladen"
    move_long_address: "2/0/8"
    move_short_address: "2/0/11"
    stop_address: "2/0/11"
    #position_address: "3/0/3"
    position_state_address: "2/2/4"
    travelling_time_down: 51
    travelling_time_up: 61
  - name: "Küche Rolladen"
    move_long_address: "2/0/9"
    move_short_address: "2/0/12"
    stop_address: "2/0/12"
    #position_address: "3/0/3"
    position_state_address: "2/2/5"
    travelling_time_down: 51
    travelling_time_up: 61
  - name: "Bad Yvonne Rolladen"
    move_long_address: "2/0/10"
    move_short_address: "2/0/13"
    stop_address: "2/0/13"
    #position_address: "3/0/3"
    position_state_address: "2/2/6"
    travelling_time_down: 51
    travelling_time_up: 61
  # OG (Jalousieaktor 1.1.3)
  - { name: "Malte Rollladen links", move_long_address: "2/0/0", move_short_address: "2/0/1", stop_address: "2/0/1", position_state_address: "2/2/0", travelling_time_down: 51, travelling_time_up: 61 }
  - { name: "Malte Rollladen rechts", move_long_address: "2/0/2", move_short_address: "2/0/3", stop_address: "2/0/3", position_state_address: "2/2/1", travelling_time_down: 51, travelling_time_up: 61 }
  - { name: "Schlafzimmer Rollladen", move_long_address: "2/0/4", move_short_address: "2/0/5", stop_address: "2/0/5", position_state_address: "2/2/2", travelling_time_down: 51, travelling_time_up: 61 }
  - { name: "Lara Rollladen", move_long_address: "2/0/6", move_short_address: "2/0/7", stop_address: "2/0/7", position_state_address: "2/2/3", travelling_time_down: 51, travelling_time_up: 61 }

#Präsenzmelder
binary_sensor:
  - name: "Bewegungsmelder Flur"
    state_address: "1/1/10" # KNX Gruppenadresse für den Status (Bewegung erkannt/nicht erkannt)
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder Sauna"
    state_address: "0/2/29" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder Außensauna"
    state_address: "0/2/27" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder EG Flur Decke"
    state_address: "0/2/9" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder OG Lara Decke"
    state_address: "0/7/1" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder OG Malte Decke"
    state_address: "0/7/0" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenzmelder OG Schlafzimmer Decke"
    state_address: "0/7/2" # Falls ein separater Status vorhanden ist
    device_class: motion # Stellt den Sensor als Bewegungsmelder dar
  - name: "Präsenz Gästebad"
    state_address: "0/7/3" # 1.1.25 HLK-Ausgang
    device_class: occupancy
    sync_state: true

sensor:
  - name: "Helligkeit Außen"
    state_address: "0/6/0" # Präsenzmelder Sauna außen 1.1.38
    type: illuminance
    sync_state: true
  - name: "Helligkeit Gästebad"
    state_address: "0/6/1" # 1.1.25 Messwert
    type: illuminance
    sync_state: true

  # Raumtemperaturen (1-Wire über Timberwolf) und aktuelle Sollwerte der Heizungsaktoren
  - { name: "Temperatur Wohnzimmer", state_address: "3/0/0", type: temperature, sync_state: true }
  - { name: "Sollwert Wohnzimmer", state_address: "3/3/20", type: temperature, sync_state: true }
