  - { name: "Sollwert Bad Yvonne", state_address: "3/3/4", type: temperature, sync_state: true }
  - { name: "Temperatur Gästebad", state_address: "3/0/8", type: temperature, sync_state: true }
  - { name: "Temperatur Ankleide", state_address: "3/0/9", type: temperature, sync_state: true }
  - { name: "Sollwert Ankleide", state_address: "3/3/1", type: temperature, sync_state: true }
  - { name: "Temperatur HWR", state_address: "3/0/12", type: temperature, sync_state: true }
  - { name: "Sollwert HWR", state_address: "3/3/5", type: temperature, sync_state: true }
  - { name: "Temperatur OG", state_address: "3/0/21", type: temperature, sync_state: true } # Flur OG Wand
