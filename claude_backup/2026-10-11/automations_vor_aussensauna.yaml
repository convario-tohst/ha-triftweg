- id: '1741520496224'
  alias: Saunaofen aus nach Zeit
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - switch.saunaofen
    to: 'on'
    for:
      hours: 2
      minutes: 0
      seconds: 0
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: switch.saunaofen
  mode: single
- id: '1741812862463'
  alias: Präsenz Außensauna
  description: ''
  use_blueprint:
    path: homeassistant/motion_light.yaml
    input:
      light_target:
        device_id:
        - a34198190cd087a95e7d19d8aa45cf89
        entity_id:
        - light.aussensauna
      motion_entity: binary_sensor.prasenzmelder_aussensauna
      no_motion_wait: 20
