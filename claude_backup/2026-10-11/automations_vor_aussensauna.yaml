- id: '1769959930146'
  alias: EG Yvonne Bad Spiegel nach 30 Minuten aus
  description: Schaltet das Spiegellicht 30 Minuten nach dem Einschalten aus
  triggers:
  - entity_id: light.licht_malte
    to: 'on'
    for: 00:30:00
    trigger: state
  actions:
  - target:
      entity_id: light.licht_malte
    action: light.turn_off
  mode: restart
- id: '1769963175361'
  alias: Spiegellicht Gästebad 30 Minuten aus
  description: Schaltet das Spiegellicht Gästebad 30 Minuten nach dem Einschalten
    aus
  triggers:
  - entity_id: light.eg_gastebad_spiegel
    to: 'on'
    for: 00:30:00
    trigger: state
  conditions: []
  actions:
  - target:
      entity_id: light.eg_gastebad_spiegel
    action: light.turn_off
  mode: restart
- id: '1769984039160'
  alias: Giebel Beleuchtung bei Bewegung (tagsüber)
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.front_door_bewegung
    - binary_sensor.einfahrt_bewegung
    to: 'on'
    trigger: state
  conditions:
  - condition: sun
    after: sunrise
    before: sunset
  actions:
  - target:
      entity_id: light.dimmer_aussenbeleuchtung_giebel
    action: light.turn_on
  mode: restart
