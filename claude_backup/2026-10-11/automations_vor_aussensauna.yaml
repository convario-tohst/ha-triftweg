- id: '1753652139078'
  alias: Bewegung Einfahrt Licht Küche
  description: ''
  use_blueprint:
    path: homeassistant/motion_light.yaml
    input:
      motion_entity: event.einfahrt_bewegung
      light_target:
        entity_id:
        - light.dimmer_kuche_decke_2
        - light.wled_2
      no_motion_wait: 1200
- id: '1753652823917'
  alias: Deaktivieren Präsenz Schlafzimmer
  description: ''
  triggers:
  - trigger: time
    at: '19:30:00'
  conditions: []
  actions:
  - action: automation.turn_off
    target:
      entity_id:
      - automation.prasenz_schlafzimmer
    data:
      stop_actions: true
  mode: single
