- id: '1742497528952'
  alias: Aktivieren Präsenz Schlafzimmer
  description: ''
  triggers:
  - trigger: time
    at: 07:00:00
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - action: automation.turn_on
    target:
      entity_id: automation.prasenz_schlafzimmer
    data: {}
  mode: single
