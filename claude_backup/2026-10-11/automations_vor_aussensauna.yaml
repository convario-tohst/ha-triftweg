- id: '1753661512620'
  alias: 'Einfahrt Bewegung Küche '
  description: ''
  use_blueprint:
    path: Blackshome/sensor-light.yaml
    input:
      motion_trigger:
      - binary_sensor.einfahrt_bewegung
      light_switch:
        entity_id: light.dimmer_kuche_decke_2
      include_sun: sun_disabled
      after_time: '20:00:00'
      before_time: 07:00:00
