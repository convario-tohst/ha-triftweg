# KNX
#knx:
# Telegramme, die HA als knx_event weiterreicht (Szenen-Taster an der Wand)
event:
  - address: "10/0/0"
    type: scene_number
  # Präsenzmelder Wohnzimmer 1.1.23 Kanal 2 (Obj. 15) schaltet die Dosen = "jemand betritt das Wohnzimmer"
  - address: "1/0/111"
  # Sperr-/Zwangsobjekte der Präsenzmelder (Wächter in packages/melder_sperren.yaml)
  - address: ["0/5/1", "0/5/2", "0/5/5", "0/4/2", "1/4/0"]
  # Melder Flur OG 1.1.24 – Bewegung (Dimmwert, nachts 0 %) für den Kinder-wach-Alarm
  - address: "0/1/6"
  # Melder Bad OG 1.1.18 – Bewegung (Dimmwert) für den Kinder-wach-Alarm
  - address: "0/1/7"

# switch
switch:
  # Wohnzimmer-Steckdosen: Schaltaktor 1.1.7, automatisch geschaltet vom Präsenzmelder 1.1.23 (Obj. 15)
  - name: "Dosen Wohnzimmer"
    address: "1/0/111"
    state_address: "1/1/0"
  # Melder Wohnzimmer 1.1.23: "Lichtkanal 1 – Bewegungserkennung sperren" (GA heißt in der ETS "Dosen Sperrobjekt")
  - name: "Melder Wohnzimmer Bewegungserkennung sperren"
    address: "1/4/0"
  # Theben 1.1.9 Kanal C2 (0/0/7) = Stromversorgung der WLED-Streifen Flur EG + Bad Yvonne -> immer an lassen
  - name: "Stromversorgung LED-Streifen"
    address: "0/0/7"
    state_address: "0/2/37"
  - name: "Tag-Nacht EG"
    address: "0/3/0"
  - name: "Tag-Nacht OG"
    address: "0/3/1"
  - name: "Saunaofen"
    address: "1/0/2"
    state_address: "1/1/3"

# Sperre / Zwangsführung der Präsenzmelder (DPT 2.001, 2 Bit): 0 = Automatik, 2 = Aus erzwingen, 3 = An erzwingen
select:
  - name: "Melder Wohnzimmer"
    address: "0/5/5" # 1.1.23 Lichtkanal 1+2 Zwangsführung
    payload_length: 0
    options: &zwang
      - { option: "Automatik", payload: 0 }
      - { option: "Aus erzwingen", payload: 2 }
      - { option: "An erzwingen", payload: 3 }
  - name: "Melder Flur EG"
    address: "0/5/1" # 1.1.22 Sperre
    payload_length: 0
    options: *zwang
  - name: "Melder Sauna außen"
    address: "0/5/2" # 1.1.38 Zwangsführung
    payload_length: 0
    options: *zwang
  - name: "Melder Bad OG"
    address: "0/4/2" # 1.1.18 Zwangsführung
    payload_length: 0
    options: *zwang

