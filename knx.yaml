climate:
  # Absoluter Komfortsollwert (schreiben) + aktueller Sollwert (lesen), Betriebsmodus, Stellwert
  - name: "Heizung Wohnzimmer" # Wohnen/Küche/Essen, 1.1.5 Kanal A-C
    temperature_address: "3/0/0"
    target_temperature_address: "3/3/32"
    target_temperature_state_address: "3/3/20"
    operation_mode_address: "3/4/0"
    operation_mode_state_address: "3/4/0"
    command_value_state_address: "3/6/0"
    sync_state: "every 10" # Timberwolf sendet nur bei Änderung -> alle 10 min nachfragen
    operation_modes: ["Comfort", "Standby", "Night", "Frost Protection"]
    min_temp: 15
    max_temp: 26
    temperature_step: 0.5
