      - in: "(flurstripe|flur stripe|stripe im flur|flur)"
        out: "Flur"
      - in: "(lara stripe|laras stripe|stripe bei lara|lara)"
        out: "Lara"
      - in: "(außensauna stripe|stripe draußen|außensauna|stripe außensauna)"
