language: de
# AUTOMATISCH ERZEUGT von scripts/schnell_saetze.py (Claude-Scratchpad) aus den Licht-Aliasen – 25.10.
# Schnelle lokale Befehle ohne Claude (< 1 s). Alles andere geht weiter an Claude.
intents:
  LichtSchnell:
    data:
      - sentences:
          - "[bitte] (mach|mache|macht|schalte|schalt|stell|stelle) [mal] [bitte] [das|die|den|im|in der|beim] {licht} {zustand} [bitte]"
          - "[bitte] [das|die|den|im|in der|beim] {licht} {zustand} [bitte]"
  LichtHelligkeit:
    data:
      - sentences:
          - "[bitte] (mach|mache|macht|schalte|schalt|stell|stelle) [mal] [bitte] [das|die|den|im|in der|beim] {licht} auf {prozent} [%|prozent] [bitte]"
          - "[bitte] [das|die|den|im|in der|beim] {licht} auf {prozent} [%|prozent] [bitte]"
  RolloSchnell:
    data:
      - sentences:
          - "[bitte] <rverb> [mal] [bitte] [die|den|das] <rollo> {raum} {richtung} [bitte]"
          - "[bitte] <rverb> [mal] [bitte] {raum} [die|den|das] <rollo> {richtung} [bitte]"
          - "[bitte] [die|den] {raum} <rollo> {richtung} [bitte]"
          - "[bitte] [die|den] <rollo> {raum} {richtung} [bitte]"
  EffektSchnell:
    data:
      - sentences:
          - "[bitte] <everb> [mal] [bitte] [im|am|beim|den|das|die] {stripe} [auf] [einen|ein|eine|den|die|das] [effekt] {effekt} [effekt] [an|ein] [bitte]"
          - "[bitte] <everb> [mal] [bitte] [einen|ein|eine|den|die|das] [effekt] {effekt} [effekt] (im|am|beim|auf dem|auf den) {stripe} [an|ein] [bitte]"
          - "[bitte] {stripe} [auf] [effekt] {effekt} [bitte]"
expansion_rules:
  everb: "(mach|mache|macht|stell|stelle|schalte|schalt|setz|setze|starte)"
  rverb: "(mach|mache|macht|fahr|fahre|fahrt|zieh|ziehe)"
  rollo: "(rollläden|rolläden|rollladen|rolladen|rollos|rollo|jalousien|jalousie)"
lists:
  richtung:
    values:
      - in: "(hoch|rauf|herauf|auf|nach oben)"
        out: "open"
      - in: "(runter|herunter|zu|nach unten)"
        out: "close"
  stripe:
