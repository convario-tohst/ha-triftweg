# Zustands-Zusammenfassung für Claude: wird jeder Sprachanfrage VORANGESTELLT (nicht im Systemprompt –
# ein sich ändernder Systemprompt bricht laufende Gespräche mit Denk-Schritten ab: API-Fehler 400, 23.10.)
template:
  - sensor:
      - name: "Sprache Zustand"
        unique_id: sprache_zustand
        icon: mdi:text-box-outline
        state: "{{ now().strftime('%H:%M') }}"
        attributes:
          text: |-
            AKTUELLER ZUSTAND (Stand {{ now().strftime('%H:%M') }}):
            {%- set raeume = [['Wohnzimmer','wohnzimmer','wohnzimmer'],['Flur EG','flur_eg','flur_eg'],['Bad Yvonne','bad_yvonne','bad_yvonne'],['Gästebad','gastebad','gastebad'],['Ankleide Yvonne','ankleide','ankleide'],['HWR','hwr','hwr'],['Flur OG','flur_og','og'],['Schlafzimmer','schlafzimmer','schlafzimmer'],['Malte','malte','malte'],['Lara','lara','lara'],['Sauna-Aufenthaltsraum','sauna_aufenthaltsraum','sauna_aufenthaltsraum']] %}
            Raumklima: {% for n, f, tt in raeume %}{% set te = states('sensor.temperatur_' ~ tt) %}{% set fe = states('sensor.feuchte_' ~ f) %}{% if is_number(te) or is_number(fe) %}{{ n }} {{ (te | float | round(1) | string ~ ' °C') if is_number(te) }}{{ (' ' ~ fe | float | round(0) | int | string ~ ' %') if is_number(fe) }}; {% endif %}{% endfor %}
            Außen: {{ state_attr('weather.forecast_home','temperature') }} °C, {{ states('weather.forecast_home') }}, Taupunkt außen {{ states('sensor.taupunkt_aussen') }} °C, {{ 'dunkel' if is_state('binary_sensor.draussen_dunkel','on') else 'hell' }}.
            Heizung: {% for c in states.climate if c.state not in ['unavailable','unknown'] %}{{ c.name | replace('Heizung ','') }} ist {{ c.attributes.current_temperature }} soll {{ c.attributes.temperature }}; {% endfor %}
            Lichter an: {{ states.light | selectattr('state','eq','on') | rejectattr('entity_id','search','screen|browser_mod|_[0-9a-f]{8}_|alle_lichter|licht_wohnen_und_kuche') | map(attribute='name') | join(', ') or 'keine' }}.
            Musik: Wohnzimmer {{ states('media_player.ma_wohnzimmer') }}{{ (' – ' ~ state_attr('media_player.ma_wohnzimmer','media_title')) if is_state('media_player.ma_wohnzimmer','playing') }}{{ (', ' ~ (state_attr('media_player.ma_wohnzimmer','volume_level') | float(0) * 100) | round(0) | int ~ ' %') if state_attr('media_player.ma_wohnzimmer','volume_level') is number }}; Schlafzimmer {{ states('media_player.ma_schlafzimmer') }}{{ (' – ' ~ state_attr('media_player.ma_schlafzimmer','media_title')) if is_state('media_player.ma_schlafzimmer','playing') }}. Quelle: {{ states('sensor.musik_quelle_text') }}
            Lüftung: Profil {{ states('sensor.vallox_aktuelles_profil') }}, {{ states('sensor.vallox_luftergeschwindigkeit') }} %, Feuchte-Modus {{ states('sensor.luftung_feuchte_modus') }}; Entfeuchter (Schlafzimmer) {{ states('humidifier.entfeuchter_og') }}{{ (', Ziel ' ~ state_attr('humidifier.entfeuchter_og','humidity') ~ ' %, gemessen ' ~ state_attr('humidifier.entfeuchter_og','current_humidity') ~ ' %') if is_state('humidifier.entfeuchter_og','on') }}.
            Zeiten: Außenlicht aus um {{ states('input_datetime.aussenlicht_aus')[:5] }}, Nachtmodus EG {{ states('switch.tag_nacht_eg') }}, OG {{ states('switch.tag_nacht_og') }}; Müll: {{ states('sensor.mull_nachste_abholung') }}.
            Personen zu Hause: {{ states.person | selectattr('state','eq','home') | map(attribute='name') | join(', ') or 'niemand' }}.
            Zuletzt geschaltet (letzte 3 Min., für Folgesätze wie "wieder aus"): {% set ns = namespace(l=[]) %}{% for s in (states.light | list) + (states.switch | list) + (states.media_player | list) + (states.cover | list) %}{% if s.state in ['on','off','playing','paused','idle','open','closed'] and (now() - s.last_changed).total_seconds() < 180 and (s.last_changed - states.counter.ha_neustarts_woche.last_changed).total_seconds() > 20 and s.context.user_id is not none and not s.entity_id is search('screen|browser_mod|_[0-9a-f]{8}_|alle_lichter|licht_wohnen_und_kuche|wled_|_einfrieren|synchronis|a1_a1b6|entfeuchter_og_|sauna_luftung|vallox|voice|nachtlicht|tag_nacht|stromversorgung|dosen_wohnzimmer|_bewegungserkennung') %}{% set ns.l = ns.l + [s.name ~ ' ' ~ s.state ~ ' (vor ' ~ ((now() - s.last_changed).total_seconds() | int) ~ ' s)'] %}{% endif %}{% endfor %}{{ ns.l | join(', ') if ns.l else 'nichts' }}.
            Staubsauger: Triftweg {{ states('vacuum.roborock_s7_triftweg') }} ({{ states('sensor.roborock_s7_triftweg_batterie') }} %), Büro Donnerschweer Straße {{ states('vacuum.roborock_s7_buro') }}, Am Markt 16 {{ states('vacuum.qrevo_s_pro_series') }}.
