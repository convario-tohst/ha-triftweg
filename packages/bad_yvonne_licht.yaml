# Bad Yvonne: Licht nach Präsenz über HA (Melder 1.1.32 meldet nur noch Präsenz auf 0/7/10, schaltet 0/0/10 nicht mehr)
# Gleiches Schema wie HWR / Ankleide Tobias:
# - Präsenz kommt + Raum dunkel genug (1-Wire Helligkeit Bad Yvonne) → Licht an (tagsüber / nachts eigene Helligkeit,
#   Nacht = Nachtmodus-Zeiten EG)
# - keine Präsenz mehr für "Nachlauf" Minuten → aus
# - Manuell ausgeschaltet bei Präsenz → bleibt aus, bis der Raum einmal leer war. Glastaster schalten weiter direkt.
# - "Entspannen" (z. B. Badewanne): Licht bleibt an, gedimmt/warm, auch ohne Bewegung; endet nach 2 h von selbst
# Die LED-Leiste folgt weiter der Decke (licht_eg.yaml) inkl. Wohlfühl-Effekte (bad_yvonne_stimmung.yaml).

input_boolean:
  bad_yvonne_licht_automatik:
    name: "Bad Yvonne: Licht nach Präsenz"
    icon: mdi:motion-sensor
  bad_yvonne_entspannen:
    name: "Bad Yvonne: Entspannen (Licht bleibt an)"
    icon: mdi:bathtub

input_number:
  bad_yvonne_nachlauf:
    name: "Bad Yvonne: Licht aus nach (ohne Präsenz)"
    icon: mdi:timer-outline
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
  bad_yvonne_lux_schwelle:
    name: "Bad Yvonne: Licht nur unter (Lux im Raum)"
    icon: mdi:brightness-5
    min: 10
    max: 1000
    step: 10
    unit_of_measurement: lx
    mode: box
  bad_yvonne_hell_tag:
    name: "Bad Yvonne: Helligkeit tagsüber"
    icon: mdi:brightness-6
    min: 10
    max: 100
    step: 5
    unit_of_measurement: "%"
  bad_yvonne_hell_entspannen:
    name: "Bad Yvonne: Helligkeit Entspannen"
    icon: mdi:brightness-4
    min: 5
    max: 100
    step: 5
    unit_of_measurement: "%"

automation:
  - id: bad_yvonne_licht_praesenz
    alias: "Bad Yvonne: Licht nach Präsenz"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.prasenz_bad_yvonne
        from: "off"
        to: "on"
        id: an
      - trigger: state
        entity_id: binary_sensor.prasenz_bad_yvonne
        from: "on"
        to: "off"
        for: { minutes: "{{ states('input_number.bad_yvonne_nachlauf') | int(1) }}" }
        id: aus
    conditions:
      - condition: state
        entity_id: input_boolean.bad_yvonne_licht_automatik
        state: "on"
      - condition: state
        entity_id: input_boolean.melder_bad_yvonne_gesperrt
        state: "off"
      - condition: state
        entity_id: input_boolean.bad_yvonne_entspannen
        state: "off"
    variables:
      # Nacht = Nachtmodus-Zeiten EG
      nacht: >
        {% set b = states('input_datetime.nacht_eg_beginn') %}{% set e = states('input_datetime.nacht_eg_ende') %}
        {% set t = now().strftime('%H:%M:%S') %}
        {{ (t >= b or t < e) if b > e else (b <= t < e) }}
    actions:
      - choose:
          - conditions:
              - "{{ trigger.id == 'an' }}"
              - >
                {% set lx = states('sensor.helligkeit_bad_yvonne') %}
                {{ not is_number(lx) or lx | float < states('input_number.bad_yvonne_lux_schwelle') | float(300) }}
            sequence:
              - action: light.turn_on
                target: { entity_id: light.dimmer_yvonne_bad }
                data:
                  brightness_pct: >
                    {{ states('input_number.bad_yvonne_hell_nacht' if nacht else 'input_number.bad_yvonne_hell_tag') | int(80) }}
          - conditions: "{{ trigger.id == 'aus' }}"
            sequence:
              - action: light.turn_off
                target: { entity_id: light.dimmer_yvonne_bad }
                data: { transition: 3 }

  - id: bad_yvonne_entspannen
    alias: "Bad Yvonne: Entspannen an/aus"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.bad_yvonne_entspannen
        to: "on"
        id: an
      - trigger: state
        entity_id: input_boolean.bad_yvonne_entspannen
        to: "on"
        for: "02:00:00"
        id: ende
      - trigger: state
        entity_id: input_boolean.bad_yvonne_entspannen
        to: "off"
        id: aus
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'an' }}"
            sequence:
              - action: light.turn_on
                target: { entity_id: light.dimmer_yvonne_bad }
                data:
                  transition: 3
                  brightness_pct: "{{ states('input_number.bad_yvonne_hell_entspannen') | int(25) }}"
          - conditions: "{{ trigger.id == 'ende' }}"
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.bad_yvonne_entspannen }
          # Entspannen beendet und niemand mehr da → aus
          - conditions: "{{ trigger.id == 'aus' and is_state('binary_sensor.prasenz_bad_yvonne', 'off') }}"
            sequence:
              - action: light.turn_off
                target: { entity_id: light.dimmer_yvonne_bad }
                data: { transition: 3 }
