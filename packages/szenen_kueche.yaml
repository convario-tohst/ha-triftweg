# Küche/Wohnzimmer: Szenen 10/0/0 → Küchen-Stripe (WLED)
# Reagiert auf beides: Wandtaster (knx_event, Szenennummer) und Szene in HA (scene.*).
# Früher nur scene.* – die ändert sich aber nicht, wenn die Szene am Taster gedrückt wird.

automation:
  - id: kueche_stripe_szenen
    alias: "Küche: Stripe folgt Szene"
    mode: restart
    triggers:
      - trigger: event
        event_type: knx_event
        event_data: { destination: "10/0/0" }
        id: knx
      - trigger: state
        entity_id: [scene.relax, scene.kochen, scene.party, scene.aus, scene.dinner]
        not_to: [unavailable, unknown]
        id: ha
    variables:
      szene: >
        {% if trigger.id == 'knx' %}
          {% set n = trigger.event.data.value | int(0) %}
          {{ {1: 'relax', 2: 'kochen', 3: 'party', 4: 'aus', 7: 'dinner'}.get(n, '') }}
        {% else %}{{ trigger.entity_id.split('.')[1] }}{% endif %}
    conditions:
      - "{{ szene != '' }}"
      # knx_event kommt nur bei Telegrammen von außen (Lesen-Antworten ignorieren)
      - "{{ trigger.id == 'ha' or trigger.event.data.telegramtype == 'GroupValueWrite' }}"
    actions:
      - choose:
          - conditions: "{{ szene == 'aus' }}"
            sequence:
              - action: light.turn_off
                target: { entity_id: light.wled_kuche }
                data: { transition: 20 }
          - conditions: "{{ szene == 'party' }}"
            sequence:
              - action: light.turn_on
                target: { entity_id: light.wled_kuche }
                data: { brightness_pct: 100, effect: Gravcentric }
        default:
          - action: light.turn_on
            target: { entity_id: light.wled_kuche }
            data:
              effect: Solid
              transition: 5
              brightness_pct: "{{ {'kochen': 100, 'relax': 30, 'dinner': 50}[szene] }}"
              rgb_color: "{{ {'kochen': [255, 160, 120], 'relax': [255, 0, 0], 'dinner': [255, 0, 0]}[szene] }}"
