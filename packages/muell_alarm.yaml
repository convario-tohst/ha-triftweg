# Müll: "fette" Erinnerung (Wunsch Tobias 14.10.)
# 1) Küchen-Stripe blinkt zwischen zwei knalligen Farben, bis in HA bestätigt wird (Müll rausgestellt = an)
#    – startet mit der Vorabend-Erinnerung (18:00) bzw. morgens am Abholtag, falls noch nicht erledigt.
# 2) Durchsage im Wohnzimmer (20 %) beim Betreten: Vorabend 18:00–19:30, Abholtag 06:30–08:00 (max. alle 20 min).
# 3) Keine Alarm-Push: Handy-Nachrichten bleiben normal (lautlos bleibt lautlos).
# Test: "Müll-Erinnerung testen" (morgen früh) – Durchsage sagt ausdrücklich "Test".

input_boolean:
  muell_alarm_aktiv:
    name: "Müll: Erinnerung aktiv (Stripe blinkt)"
    icon: mdi:alarm-light
  muell_test_morgen:
    name: "Müll: Test morgen früh"
    icon: mdi:test-tube

input_text:
  muell_alarm_tonne:
    name: "Müll: aktuelle Tonne"
    max: 100

rest_command:
  wled_kueche_blinken:
    url: "http://192.168.11.162/json/state"
    method: post
    content_type: "application/json"
    payload: >
      {"on": true, "bri": 255, "transition": 0,
       "seg": [{"id": 0, "fx": 1, "sx": 150, "ix": 128, "col": [{{ farbe1 }}, {{ farbe2 }}, [0, 0, 0]]}]}

script:
  muell_alarm_start:
    alias: "Müll: Erinnerung starten (Stripe blinkt)"
    icon: mdi:alarm-light
    mode: single
    fields:
      tonne: { name: Tonne, selector: { text: } }
    variables:
      t: "{{ tonne | default(states('sensor.mull_morgen')) }}"
      farben: >
        {% if 'Bio' in t %}{{ [[0, 255, 0], [255, 200, 0]] }}
        {% elif 'Rest' in t %}{{ [[255, 0, 0], [255, 255, 255]] }}
        {% elif 'Gelb' in t %}{{ [[255, 220, 0], [0, 80, 255]] }}
        {% elif 'Papier' in t %}{{ [[0, 80, 255], [255, 0, 0]] }}
        {% else %}{{ [[255, 0, 255], [0, 255, 255]] }}{% endif %}
    sequence:
      - action: input_text.set_value
        target: { entity_id: input_text.muell_alarm_tonne }
        data: { value: "{{ t[:100] }}" }
      # bisherigen Stripe-Zustand merken (nur beim ersten Start)
      - if: "{{ is_state('input_boolean.muell_alarm_aktiv', 'off') }}"
        then:
          - action: scene.create
            data: { scene_id: muell_stripe_vorher, snapshot_entities: [light.wled_kuche] }
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.muell_alarm_aktiv }
      - action: rest_command.wled_kueche_blinken
        continue_on_error: true
        data: { farbe1: "{{ farben[0] }}", farbe2: "{{ farben[1] }}" }

  muell_alarm_stop:
    alias: "Müll: Erinnerung beenden (Stripe zurück)"
    icon: mdi:alarm-light-off
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.muell_alarm_aktiv
        state: "on"
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.muell_alarm_aktiv }
      - if: "{{ states.scene.muell_stripe_vorher is not none }}"
        then:
          - action: scene.turn_on
            target: { entity_id: scene.muell_stripe_vorher }
        else:
          - action: light.turn_off
            target: { entity_id: light.wled_kuche }

  muell_durchsage:
    alias: "Müll: Durchsage Wohnzimmer"
    icon: mdi:bullhorn
    mode: single
    fields:
      text: { name: Text, required: true, selector: { text: } }
    variables:
      war_still: "{{ not is_state('media_player.ma_wohnzimmer', 'playing') }}"
    sequence:
      # 1. Versuch: Music Assistant Durchsage mit fester Lautstärke 20 % (laufende Musik wird kurz abgesenkt)
      - action: music_assistant.play_announcement
        continue_on_error: true
        response_variable: ok1
        target: { entity_id: media_player.ma_wohnzimmer }
        data:
          url: "media-source://tts/tts.home_assistant_cloud?message={{ text | urlencode }}&language=de-DE"
          announce_volume: 20
      - delay: 1
      # Rückfall: normale Sprachausgabe (nur wenn gerade keine Musik läuft, mit 20 %)
      - if: "{{ ok1 is not defined and war_still }}"
        then:
          - action: media_player.volume_set
            continue_on_error: true
            target: { entity_id: media_player.ma_wohnzimmer }
            data: { volume_level: 0.2 }
          - action: tts.speak
            continue_on_error: true
            target: { entity_id: tts.home_assistant_cloud }
            data: { media_player_entity_id: media_player.ma_wohnzimmer, message: "{{ text }}", language: de-DE }

automation:
  # Stripe-Erinnerung starten: mit der Vorabend-Erinnerung und morgens am Abholtag (falls nicht erledigt)
  - id: muell_alarm_starten
    alias: "Müll: Stripe-Erinnerung starten"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.muell_erinnerung_vorabend
        id: abend
      - trigger: time
        at: input_datetime.muell_erinnerung_morgens
        id: morgen
    conditions:
      - condition: state
        entity_id: input_boolean.muell_erledigt
        state: "off"
      - "{{ (trigger.id == 'abend' and states('sensor.mull_morgen') not in ['keine', 'unknown', 'unavailable'])
            or (trigger.id == 'morgen' and states('sensor.mull_heute') not in ['keine', 'unknown', 'unavailable']) }}"
    actions:
      - action: script.muell_alarm_start
        data: { tonne: "{{ states('sensor.mull_morgen') if trigger.id == 'abend' else states('sensor.mull_heute') }}" }

  # Bestätigt (Handy, Dashboard, Sprache) → Stripe zurück; ebenso nach Abholung (12 Uhr Reset)
  - id: muell_alarm_beenden
    alias: "Müll: Stripe-Erinnerung beenden"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.muell_erledigt
        to: "on"
      - trigger: time
        at: "12:00:00"
    actions:
      - action: script.muell_alarm_stop
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.muell_test_morgen }

  # Blinken halten, falls zwischendurch eine Szene den Stripe umgestellt hat (alle 10 min)
  - id: muell_alarm_halten
    alias: "Müll: Stripe-Blinken halten"
    triggers:
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: state
        entity_id: input_boolean.muell_alarm_aktiv
        state: "on"
      - "{{ state_attr('light.wled_kuche', 'effect') != 'Blink' }}"
    actions:
      - action: script.muell_alarm_start
        data: { tonne: "{{ states('input_text.muell_alarm_tonne') }}" }

  # Durchsage beim Betreten des Wohnzimmers
  - id: muell_durchsage_betreten
    alias: "Müll: Durchsage beim Betreten des Wohnzimmers"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.prasenz_wohnbereich
        from: "off"
        to: "on"
      # bis der Wohnzimmer-Melder umprogrammiert ist: er schaltet beim Betreten die Dosen ein
      - trigger: event
        event_type: knx_event
        event_data: { destination: "1/0/111", source: "1.1.23" }
    conditions:
      - "{{ trigger.platform == 'state' or (trigger.event.data.telegramtype == 'GroupValueWrite' and trigger.event.data.data == 1) }}"
      - "{{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > 1200 }}"
      - condition: or
        conditions:
          # Test (morgen früh)
          - condition: and
            conditions:
              - condition: state
                entity_id: input_boolean.muell_test_morgen
                state: "on"
              - condition: time
                after: "06:30:00"
                before: "08:30:00"
          # Vorabend 18:00–19:30
          - condition: and
            conditions:
              - condition: time
                after: "18:00:00"
                before: "19:30:00"
              - "{{ states('sensor.mull_morgen') not in ['keine', 'unknown', 'unavailable'] }}"
              - condition: state
                entity_id: input_boolean.muell_erledigt
                state: "off"
          # Abholtag morgens 06:30–08:00
          - condition: and
            conditions:
              - condition: time
                after: "06:30:00"
                before: "08:00:00"
              - "{{ states('sensor.mull_heute') not in ['keine', 'unknown', 'unavailable'] }}"
              - condition: state
                entity_id: input_boolean.muell_erledigt
                state: "off"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.muell_test_morgen
                state: "on"
            sequence:
              # für den Test "noch nicht erledigt" setzen, damit die Bestätigung in HA den Stripe beendet
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.muell_erledigt }
              - action: script.muell_alarm_start
                data: { tonne: "Bioabfall" }
              - action: script.muell_durchsage
                data:
                  text: >
                    Achtung, das ist nur ein Test der Müll-Erinnerung. Wenn wirklich Müll abgeholt wird, sage ich hier
                    Bescheid und der Streifen in der Küche blinkt, bis ihr in Home Assistant auf Erledigt tippt.
              - action: input_boolean.turn_off
                target: { entity_id: input_boolean.muell_test_morgen }
        default:
          - variables:
              tonne: "{{ states('sensor.mull_heute') if now().hour < 12 else states('sensor.mull_morgen') }}"
          - action: script.muell_alarm_start
            data: { tonne: "{{ tonne }}" }
          - action: script.muell_durchsage
            data:
              text: >
                {% if now().hour < 12 %}Guten Morgen! Heute wird {{ tonne }} abgeholt. Die Tonne ist noch nicht als rausgestellt markiert.
                {% else %}Erinnerung: Morgen früh wird {{ tonne }} abgeholt. Bitte die Tonne heute Abend rausstellen
                und danach in Home Assistant auf Erledigt tippen.{% endif %}
